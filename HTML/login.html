<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/component.css">
    <link rel="stylesheet" href="../CSS/register.css">

    <!-- icon fonts -->
        <!-- Basic Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <!-- Filled Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
        <!-- Brand Icons -->
        <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    
</head>
<body>
    <div class="opening">VisualSkill</div>

    <section>
        <div class="kotak-tengah" style="position: relative; z-index: 1;">
            <div class="pict-container">
                <img src="../Assets/atom.gif" alt="atom" id="atom-gif" />
            </div>
    
            <div class="title">Login</div>
          
            <div class="form-text">
                <input class="text-box" type="email" name="" id="email" required>
                <i class="bx bx-envelope"></i>
                <label for="email">Email</label>
            </div>
            <div class="form-text">
                <input class="text-box" type="password" name="" id="pass" required>
                <i class="bx bx-lock"></i>
                <label for="pass">Password</label>
                <i class="bx bx-eye eyeicon" id="eye-icon"></i>
            </div>

            <a href="homepage.html">
                <button class="button" id="cofirmBtn">Login</button>
            </a>

            <div class="register-login-change">
                Don't have an Account? 
                <a href="register.html"> Register Here <span>&rarr;</span></a>
            </div>

             
        </div>
    </section>

    <script src="../JS/register.js"></script>
</body>
</html>
