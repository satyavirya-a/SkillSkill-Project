<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/component.css">
    <link rel="stylesheet" href="../CSS/register.css">
    <link rel="stylesheet" href="../CSS/login.css">

  
</head>
<body>
    <div class="opening">VisualSkill</div>

    <section>
        <div class="kotak-tengah" style="position: relative; z-index: 1;">
            <div class="pict-container">
                <img src="../Assets/atom.gif" alt="atom" id="atom-gif" />
            </div>
    
            <div class="title">Login</div>
          
            <div class="form-text">
                <input class="text-box" type="email" name="" id="email" required>
                <img src="../Assets/mail-icon.png">
                <label for="email">Email</label>
            </div>
            <div class="form-text">
                <input class="text-box" type="password" name="" id="pass" required>
                <img src="../Assets/lock-icon.png">
                <label for="pass">Password</label>
                <img src="../Assets/eye-icon.png" id="eye-icon">
            </div>

            <a href="homepage.html">
                <button class="button" id="cofirmBtn">Login</button>
            </a>

            <div class="register-login-change">
                Don't have an Account? 
                <a href="register.html"> Register Here <span>&rarr;</span></a>
            </div>

             
        </div>
    </section>

    <script src="../JS/register.js"></script>
</body>
</html>
