<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/component.css">
    <link rel="stylesheet" href="../CSS/register.css">

    
</head>
<body>
    <div class="opening">VisualSkill</div>
    <section>
        <form id="form" action="/" class="kotak-tengah">
            <div class="pict-container">
                <img src="../Assets/atom.gif" alt="atom" id="atom-gif" />
            </div>
    
            <div class="title">Register</div>

            <div class="form-content">
                <div class="form-text">
                    <input class="text-box" type="text" id="name" required minlength="3" pattern="^[A-Za-z][A-Za-z\s'-]{2,}$" title="Use at least 3 letters. Spaces, apostrophes, and hyphens are allowed." autofocus>
                    <img src="../Assets/user-icon.png">
                    <label for="name">Name</label>

                    <span class="error"></span>

                </div>

                <div class="gender-form">
                   <img src="../Assets/gender-icon.png">
                    <div class="gender">Gender:</div>
                    <div class="gender-option">
                        <div class="list">
                            <input type="radio" name="gender" id="male" value="male"> <p class="list-gender">Male</p>
                        </div>
                        <div class="list">
                            <input type="radio" name="gender" id="female" value="female"> <p class="list-gender">Female</p>
                        </div>
                        <div class="list">
                            <input type="radio" name="gender" id="prefer-not-to-say" value="prefer-not-to-say"> <p class="list-gender">Preferred not to say</p>
                        </div>
                    </div>
                    <span class="error"></span>
                </div>
                <div class="form-text">
                    <input class="text-box" type="date" name="" id="dob" required>
                    <img src="../Assets/date-icon.png">
                    <label for="dob">Date of Birth</label>

                    <span class="error"></span>
                </div>
                <div class="form-text">
                    <input class="text-box" type="email" name="" id="email" required>
                    <img src="../Assets/mail-icon.png">
                    <label for="email">Email</label>

                    <span class="error"></span>
                </div>
                <div class="form-text">
                    <input class="text-box" type="password" name="" id="pass" required>
                    <img src="../Assets/lock-icon.png">
                    <label for="pass">Password</label>
                    <img src="../Assets/eye-icon.png" id="eye-icon">

                    <span class="error"></span>

                </div>

                <div class="form-text">
                    <input class="text-box" type="password" name="" id="conf-pass" required>
                    <img src="../Assets/lock-icon.png">
                    <label for="conf-pass">Confirm Password</label>
                    <img src="../Assets/eye-icon.png" id="eye-icon-conf">

                    <span class="error"></span>
                </div>

                <div class="terms-container">
                    <div class="terms-content">
                        <input type="checkbox" id="terms">
                        <label for="terms" class="terms-text">I agree to the <a href="">Terms</a> & <a href="">Privacy Policy</a></label>
                    </div>
                    
                    <span class="error"></span>
                </div>

                <button class="button" id="cofirmBtn" type="submit">Register Now</button>
                

                <div class="register-login-change">
                    Already Have an Account? 
                    <a href="login.html"> Login Here <span>&rarr;</span></a>
                </div>



            </div>
            
        </form>
    </section>

    <script src="../JS/register.js"></script>
</body>
</html>
